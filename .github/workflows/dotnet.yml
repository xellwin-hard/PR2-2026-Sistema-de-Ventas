name: .NET build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar aplicación
        run: dotnet restore ./src/NexCodeSales/NexCodeSales.csproj

      - name: Compilar aplicación
        run: dotnet build ./src/NexCodeSales/NexCodeSales.csproj --configuration Release --no-restore

      - name: Ejecutar pruebas automatizadas
        run: dotnet test ./tests/NexCodeSales.Tests/NexCodeSales.Tests.csproj --configuration Release
